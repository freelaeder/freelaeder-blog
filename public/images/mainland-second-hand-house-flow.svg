<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#FBF9F3"/>
  <text x="72" y="92" fill="#213547" font-family="Arial, sans-serif" font-size="42" font-weight="700">中国大陆二手房交易推荐流程</text>
  <text x="72" y="132" fill="#5B6570" font-family="Arial, sans-serif" font-size="22">把风险前置，把付款后置</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="182" width="206" height="118" rx="22" fill="#1F3A5F"/>
    <text x="102" y="226" fill="#FFF8EE" font-size="24" font-weight="700">1. 初看房</text>
    <text x="102" y="264" fill="#D5E2F1" font-size="18">看楼层、采光、户型</text>
    <text x="102" y="289" fill="#D5E2F1" font-size="18">先筛明显不合适房源</text>

    <rect x="316" y="182" width="206" height="118" rx="22" fill="#355C7D"/>
    <text x="346" y="226" fill="#FFF8EE" font-size="24" font-weight="700">2. 二看房</text>
    <text x="346" y="264" fill="#DDEAF4" font-size="18">晚上看噪音和停车</text>
    <text x="346" y="289" fill="#DDEAF4" font-size="18">下雨后查漏水排水</text>

    <rect x="560" y="182" width="206" height="118" rx="22" fill="#6C8EAD"/>
    <text x="590" y="226" fill="#FDFBF7" font-size="24" font-weight="700">3. 查价格</text>
    <text x="590" y="264" fill="#EEF4F8" font-size="18">查同小区真实成交</text>
    <text x="590" y="289" fill="#EEF4F8" font-size="18">不要只看挂牌价</text>

    <rect x="804" y="182" width="324" height="118" rx="22" fill="#E9EFE5" stroke="#9EB490" stroke-width="2"/>
    <text x="834" y="226" fill="#3E5933" font-size="24" font-weight="700">4. 查产权</text>
    <text x="834" y="264" fill="#41533B" font-size="18">确认抵押、查封、共有人、用途</text>
    <text x="834" y="289" fill="#41533B" font-size="18">这一关没过，不进入付款环节</text>

    <rect x="72" y="360" width="250" height="118" rx="22" fill="#F5E7D3"/>
    <text x="102" y="404" fill="#8A5A15" font-size="24" font-weight="700">5. 贷款预审</text>
    <text x="102" y="442" fill="#5D421D" font-size="18">先问银行额度和条件</text>
    <text x="102" y="467" fill="#5D421D" font-size="18">别交钱后才发现贷不下</text>

    <rect x="362" y="360" width="250" height="118" rx="22" fill="#F1DED9"/>
    <text x="392" y="404" fill="#8B3D3D" font-size="24" font-weight="700">6. 核税费</text>
    <text x="392" y="442" fill="#5C2C2C" font-size="18">让中介出书面清单</text>
    <text x="392" y="467" fill="#5C2C2C" font-size="18">自己再核对一遍</text>

    <rect x="652" y="360" width="250" height="118" rx="22" fill="#E8F0E3"/>
    <text x="682" y="404" fill="#45603A" font-size="24" font-weight="700">7. 谈价格</text>
    <text x="682" y="442" fill="#354530" font-size="18">用缺陷、房龄、税费</text>
    <text x="682" y="467" fill="#354530" font-size="18">和交房条件去议价</text>

    <rect x="942" y="360" width="186" height="118" rx="22" fill="#213547"/>
    <text x="970" y="404" fill="#FFF8EE" font-size="24" font-weight="700">8. 签协议</text>
    <text x="970" y="442" fill="#D5E2F1" font-size="18">先写清前提</text>
    <text x="970" y="467" fill="#D5E2F1" font-size="18">再交定金</text>

    <rect x="72" y="548" width="330" height="124" rx="22" fill="#1E5B4F"/>
    <text x="102" y="594" fill="#F4FFF9" font-size="24" font-weight="700">9. 网签 + 资金监管</text>
    <text x="102" y="633" fill="#D8F1E9" font-size="18">先让合同和资金进入可追踪状态</text>

    <rect x="440" y="548" width="330" height="124" rx="22" fill="#577D32"/>
    <text x="470" y="594" fill="#F7FFF1" font-size="24" font-weight="700">10. 贷款 / 缴税 / 过户</text>
    <text x="470" y="633" fill="#E7F2DA" font-size="18">按节点推进，不跳步骤</text>

    <rect x="808" y="548" width="320" height="124" rx="22" fill="#7E4E2A"/>
    <text x="838" y="594" fill="#FFF7EE" font-size="24" font-weight="700">11. 交房验收</text>
    <text x="838" y="633" fill="#F6E2D1" font-size="18">查欠费、钥匙、家具家电和空置状态</text>
  </g>
  <g stroke="#8DA0AF" stroke-width="4" stroke-linecap="round">
    <path d="M278 241H302"/>
    <path d="M522 241H546"/>
    <path d="M766 241H790"/>
    <path d="M966 300V330"/>
    <path d="M197 300V330"/>
    <path d="M487 300V330"/>
    <path d="M777 300V330"/>
    <path d="M1035 478V518"/>
    <path d="M237 478V518"/>
    <path d="M605 478V518"/>
  </g>
</svg>
